name: Deploy site

on:
  push:
    branches: [main]
  workflow_run:            # rebuild after the daily scrape commits new prices
    workflows: ["Daily price scrape"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main        # workflow_run would otherwise check out the commit before the new prices
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download set catalog
        run: python -m lego_prices catalog
      - name: Download ages from Brickset
        run: python -m lego_prices ages
        env:
          BRICKSET_API_KEY: ${{ secrets.BRICKSET_API_KEY }}
      - name: Build site
        run: python -m lego_prices site
      - name: Make reels
        id: reels
        continue-on-error: true   # the site still deploys when a video fails
        timeout-minutes: 15       # unreachable apt mirrors once held this step for an hour
        run: |
          # pip only: apt mirrors were unreachable on the runner (2026-11-11), and fonts ship in the repo
          timeout 300 pip install --quiet --disable-pip-version-check pillow imageio-ffmpeg==0.8.1
          timeout 600 python -u -m lego_prices reels
      - name: Reels fallback page
        if: steps.reels.outcome != 'success'
        run: |
          mkdir -p site/rolki
          [ -f site/rolki/index.html ] || cat > site/rolki/index.html <<'HTML'
          <!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow">
          <meta name="viewport" content="width=device-width, initial-scale=1"><title>Rolki na dziś</title></head>
          <body style="font-family:system-ui,sans-serif;max-width:640px;margin:0 auto;padding:16px">
          <h1>Rolki na dziś</h1><p>Dzisiejsze rolki nie powstały (błąd generatora). Spróbuj po następnej aktualizacji strony.</p>
          </body></html>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
