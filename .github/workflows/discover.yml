name: Discover products

on:
  schedule:
    - cron: "0 3 * * 1"   # weekly, Monday 03:00 UTC, before the daily scrape
  workflow_dispatch:
    inputs:
      probe:
        description: "Space-separated shop URLs to test instead of running discovery"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download set catalog
        run: python -m lego_prices catalog
      - name: Probe shops
        if: ${{ inputs.probe != '' }}
        run: python -m lego_prices probe ${{ inputs.probe }}
      - name: Discover products
        if: ${{ inputs.probe == '' }}
        run: python -m lego_prices discover
      - name: Commit results
        run: |
          git config user.name "lego-prices-bot"
          git config user.email "lego-prices-bot@users.noreply.github.com"
          git add data/discovered data/probe_report.csv 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Discovered products $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
