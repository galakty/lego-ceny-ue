name: Daily price scrape

on:
  schedule:
    - cron: "0 5 * * *"   # daily at 05:00 UTC (06:00/07:00 in Poland)
  workflow_dispatch:       # manual run from the Actions tab
    inputs:
      debug:
        description: "Save fetched pages to the debug-html branch"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Scrape prices
        run: python -m lego_prices scrape
        env:
          DEBUG_HTML_DIR: ${{ inputs.debug && '/tmp/debug-html' || '' }}
      - name: Save pages for debugging
        if: ${{ inputs.debug }}
        run: |
          cd /tmp/debug-html
          git init -q -b debug-html
          git config user.name "lego-prices-bot"
          git config user.email "lego-prices-bot@users.noreply.github.com"
          git add -A && git commit -qm "Pages from $(date -u +%FT%H:%M)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" debug-html
      - name: Commit price history
        run: |
          git config user.name "lego-prices-bot"
          git config user.email "lego-prices-bot@users.noreply.github.com"
          if ! out=$(git add data/prices.csv data/last_run.csv 2>&1); then
            echo "::error::git add: $(echo "$out" | tr '\n' ' ')"
            exit 1
          fi
          if git diff --cached --quiet; then exit 0; fi
          if ! out=$(git commit -m "Prices for $(date -u +%F)" 2>&1); then
            echo "::error::git commit: $(echo "$out" | tr '\n' ' ')"
            exit 1
          fi
          git pull --rebase origin main 2>&1 | tail -3 || true
          if ! out=$(git push origin HEAD:main 2>&1); then
            echo "::error::git push: $(echo "$out" | tr '\n' ' ')"
            exit 1
          fi
