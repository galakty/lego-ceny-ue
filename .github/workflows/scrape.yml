name: Codzienne pobieranie cen

on:
  schedule:
    - cron: "0 5 * * *"   # codziennie o 5:00 UTC (6:00/7:00 w Polsce)
  workflow_dispatch:       # ręczne uruchomienie z zakładki Actions

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testy
        run: python -m unittest discover -s tests -v
      - name: Pobierz ceny
        run: python -m lego_ceny scrape
      - name: Zapisz historię cen w repo
        run: |
          git config user.name "lego-ceny-bot"
          git config user.email "lego-ceny-bot@users.noreply.github.com"
          git add data/prices.csv
          git diff --cached --quiet || git commit -m "Ceny z $(date -u +%F)"
          git push
